<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinamento DATAPREV - Parte 1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');

        :root {
            --bg-color: #ffffff;
            --text-color: #4b4b4b;
            --subtitle-color: #777777;
            --border-color: #e5e5e5;
            --opt-bg: #ffffff;
            --opt-hover: #f7f7f7;
            --theory-bg: #ddf4ff;
            --theory-border: #84d8ff;
            --theory-title: #1cb0f6;
            --feedback-bg: rgba(255, 255, 255, 0.6);
            --header-icon: #afafaf;
            --selected-bg: #ddf4ff;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --subtitle-color: #a0a0a0;
            --border-color: #333333;
            --opt-bg: #1e1e1e;
            --opt-hover: #2c2c2c;
            --theory-bg: #1e293b;
            --theory-border: #38bdf8;
            --theory-title: #38bdf8;
            --feedback-bg: rgba(0, 0, 0, 0.4);
            --header-icon: #888888;
            --selected-bg: #0c3149;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--header-icon);
            padding: 5px;
            z-index: 10;
        }

        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; box-sizing: border-box; }
        .screen.active { display: flex; }

        .menu-container { max-width: 400px; width: 100%; padding: 60px 20px 40px 20px; text-align: center; margin: auto; }
        .menu-title { font-size: 28px; font-weight: 800; color: #58cc02; margin-bottom: 10px; }
        .menu-subtitle { font-size: 18px; margin-bottom: 30px; color: var(--subtitle-color); }

        .menu-btn {
            padding: 15px; font-size: 18px; font-weight: 800; border-radius: 15px;
            border: 2px solid var(--border-color); background-color: var(--opt-bg);
            color: var(--text-color); cursor: pointer; width: 100%; margin-bottom: 10px;
            transition: all 0.2s; box-shadow: 0 4px 0 var(--border-color);
        }
        .menu-btn:active { transform: translateY(4px); box-shadow: none; }
        .menu-btn.primary { background-color: #58cc02; color: #fff; border-color: #58cc02; box-shadow: 0 4px 0 #58a700; }
        .menu-btn.secondary { background-color: #1cb0f6; color: #fff; border-color: #1cb0f6; box-shadow: 0 4px 0 #1899d6; }

        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .nav-btn { font-size: 24px; color: var(--header-icon); cursor: pointer; font-weight: bold; padding: 5px 10px; text-decoration: none;}
        .progress-bar { flex-grow: 1; height: 16px; background-color: var(--border-color); border-radius: 8px; overflow: hidden; margin: 0 10px; }
        .progress-fill { height: 100%; background-color: #58cc02; width: 0%; border-radius: 8px; transition: width 0.4s ease; }
        .progress-text { font-size: 14px; font-weight: 800; color: var(--text-color); margin-right: 15px; white-space: nowrap; }

        .score-board { display: flex; gap: 10px; font-weight: 800; font-size: 16px; }
        .score-correct { color: #58cc02; }
        .score-wrong { color: #ea2b2b; }

        .quiz-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 0 20px; max-width: 600px; margin: 0 auto; width: 100%; box-sizing: border-box; overflow-y: auto; padding-bottom: 20px; }
        .theory-card { background-color: var(--theory-bg); border: 2px solid var(--theory-border); border-radius: 15px; padding: 15px; margin-bottom: 20px; width: 100%; box-sizing: border-box; display: none; }
        .theory-card h3 { margin: 0 0 10px 0; color: var(--theory-title); font-size: 16px; text-transform: uppercase; }
        .theory-card p { margin: 0; font-size: 15px; font-weight: 700; color: var(--text-color); line-height: 1.4; }
        .question-title { font-size: 19px; font-weight: 800; margin-bottom: 25px; text-align: left; width: 100%; line-height: 1.4; }

        .options { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .option { padding: 15px; border: 2px solid var(--border-color); background-color: var(--opt-bg); border-radius: 15px; cursor: pointer; font-size: 16px; font-weight: 700; color: var(--text-color); transition: all 0.2s ease; line-height: 1.3; }
        .option:hover { background-color: var(--opt-hover); }
        .option.selected { border-color: #84d8ff; background-color: var(--selected-bg); color: #1cb0f6; }
        .option.correct { border-color: #58cc02; background-color: #d7ffb8; color: #4b4b4b; pointer-events: none; }
        .option.wrong { border-color: #ea2b2b; background-color: #ffdfe0; color: #4b4b4b; pointer-events: none; }
        body.dark-mode .option.correct { background-color: rgba(88, 204, 2, 0.2); color: #e0e0e0; }
        body.dark-mode .option.wrong { background-color: rgba(234, 43, 43, 0.2); color: #e0e0e0; }
        .option.disabled { pointer-events: none; opacity: 0.6; }

        .footer { border-top: 2px solid var(--border-color); background-color: var(--bg-color); padding: 15px 20px 20px 20px; display: flex; justify-content: center; transition: background-color 0.3s; }
        .footer-content { max-width: 600px; width: 100%; display: flex; flex-direction: column; }
        .feedback-area { display: none; flex-direction: column; margin-bottom: 15px; }
        .feedback-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        .feedback-justification { font-size: 15px; font-weight: 700; color: var(--text-color); line-height: 1.4; background-color: var(--feedback-bg); padding: 10px; border-radius: 10px; margin: 0; }
        .feedback-correct { color: #58cc02; }
        .feedback-wrong { color: #ea2b2b; }

        .btn { padding: 15px; font-size: 17px; font-weight: 800; border-radius: 15px; border: none; cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; }
        .btn-check { background-color: var(--border-color); color: var(--header-icon); pointer-events: none; }
        .btn-check.active { background-color: #58cc02; color: #ffffff; box-shadow: 0 4px 0 #58a700; pointer-events: auto; }
        .btn-check.active:active { transform: translateY(4px); box-shadow: none; }
        
        .footer.correct-bg { background-color: #d7ffb8; border-color: #d7ffb8; }
        .footer.wrong-bg { background-color: #ffdfe0; border-color: #ffdfe0; }
        body.dark-mode .footer.correct-bg { background-color: rgba(88, 204, 2, 0.15); border-color: rgba(88, 204, 2, 0.3); }
        body.dark-mode .footer.wrong-bg { background-color: rgba(234, 43, 43, 0.15); border-color: rgba(234, 43, 43, 0.3); }

        .btn-continue-correct { background-color: #58cc02; color: #ffffff; box-shadow: 0 4px 0 #58a700; }
        .btn-continue-wrong { background-color: #ea2b2b; color: #ffffff; box-shadow: 0 4px 0 #c72323; }
        .btn-continue-correct:active, .btn-continue-wrong:active { transform: translateY(4px); box-shadow: none; }

        .final-score { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .final-stat { background-color: var(--opt-bg); border: 2px solid var(--border-color); padding: 15px 25px; border-radius: 15px; font-size: 20px; font-weight: 800; }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" title="Alternar Tema">🌓</button>

    <div class="screen active" id="home-screen">
        <div class="menu-container">
            <div class="menu-title">Treinamento DATAPREV</div>
            <div class="menu-subtitle">Como você quer estudar hoje? (Parte 1)</div>
            <button class="menu-btn primary" onclick="selectMode('aprender')">Modo Aprender (Teoria Antes)</button>
            <button class="menu-btn secondary" onclick="selectMode('quiz')">Modo Quiz (Teoria Depois)</button>
        </div>
    </div>

    <div class="screen" id="subject-screen">
        <div class="header" style="justify-content: flex-start; padding: 10px;">
            <div class="nav-btn" onclick="showScreen('home-screen')" title="Página Inicial">🏠 Início</div>
        </div>
        <div class="menu-container" style="padding-top: 10px;">
            <div class="menu-title">Escolha o Assunto</div>
            <div class="menu-subtitle">Filtre as questões por disciplina</div>
            <button class="menu-btn" onclick="startQuiz('Língua Portuguesa')">Língua Portuguesa</button>
            <button class="menu-btn primary" onclick="startQuiz('Todos')">Misturar Todos</button>
        </div>
    </div>

    <div class="screen" id="quiz-screen">
        <div class="header">
            <div class="nav-btn" onclick="showScreen('home-screen')" title="Página Inicial">🏠</div>
            <div class="nav-btn" id="btn-back" onclick="prevQuestion()" title="Questão Anterior">←</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text" id="progress-text">1 / 50</div>
            <div class="score-board">
                <span class="score-correct" id="ui-score-correct">✅ 0</span>
                <span class="score-wrong" id="ui-score-wrong">❌ 0</span>
            </div>
            <div class="nav-btn" onclick="showScreen('home-screen')" title="Sair do Quiz" style="margin-left: 15px;">×</div>
        </div>

        <div class="quiz-content" id="quiz-container">
            <div class="theory-card" id="theory-card">
                <h3>Teoria</h3>
                <p id="theory-card-text"></p>
            </div>
            <div class="question-title" id="question-text">Carregando...</div>
            <div class="options" id="options-container"></div>
        </div>

        <div class="footer" id="footer">
            <div class="footer-content">
                <div class="feedback-area" id="feedback-area">
                    <div class="feedback-title" id="feedback-title"></div>
                    <p class="feedback-justification" id="feedback-justification"></p>
                </div>
                <button class="btn btn-check" id="action-btn">Verificar</button>
            </div>
        </div>
    </div>

    <div class="screen" id="end-screen">
        <div class="menu-container">
            <div class="menu-title" style="font-size: 32px;">Lição Concluída!</div>
            <div class="menu-subtitle">Veja o seu desempenho:</div>
            
            <div class="final-score">
                <div class="final-stat" style="color: #58cc02;" id="final-correct">✅ 0</div>
                <div class="final-stat" style="color: #ea2b2b;" id="final-wrong">❌ 0</div>
            </div>

            <button class="menu-btn primary" onclick="showScreen('home-screen')">Voltar ao Início</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        // PARTE 1 DE 5: MÓDULO 1 - LÍNGUA PORTUGUESA (Questões 1 a 50)
        const allQuestions = [
            {
                subject: 'Língua Portuguesa',
                question: '"O atendimento remoto da DATAPREV cresceu 40% no último ano. Apesar do avanço tecnológico, muitos segurados ainda preferem o atendimento presencial..." A relação estabelecida pela palavra "apesar" no texto indica:',
                options: ["Adição de uma nova informação.", "Conclusão do raciocínio anterior.", "Contraste entre a informação anterior e a posterior.", "Explicação da causa do crescimento.", "Comparação de igualdade entre os fatos."],
                answer: 2,
                justification: '"Apesar de" é locução concessiva que introduz uma ideia que contraria a expectativa criada pela oração anterior. Configura contraste/concessão.[span_0](start_span)[span_0](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Em um manual interno, lê-se: "Os servidores devem, sempre que possível, priorizar o uso de canais digitais..." A expressão "sempre que possível" tem a função de:',
                options: ["Tornar a orientação uma obrigação absoluta e inegociável.", "Relativizar a orientação, admitindo exceções conforme o contexto.", "Negar por completo a validade da orientação.", "Indicar que a orientação só vale para casos excepcionais.", "Reforçar que o canal digital é o único meio permitido."],
                answer: 1,
                justification: 'A expressão "sempre que possível" é um modalizador que suaviza a força da orientação, admitindo que, em determinadas situações, ela pode não ser aplicável.[span_1](start_span)[span_1](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: '"Nem todo atraso no pagamento de benefício decorre de erro do sistema; muitas vezes, a causa está na desatualização cadastral..." Pode-se inferir do texto que:',
                options: ["O sistema nunca apresenta falhas.", "A desatualização cadastral é a única causa de atraso.", "Existem, pelo menos, duas causas possíveis para o atraso no pagamento.", "O segurado é sempre responsável pelo atraso.", "O erro do sistema é mais frequente que a desatualização cadastral."],
                answer: 2,
                justification: 'O texto usa a estrutura "nem todo... muitas vezes" para indicar que existe mais de uma causa possível (erro do sistema e desatualização cadastral), sem afirmar exclusividade.[span_2](start_span)[span_2](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: '"Não é a tecnologia que substitui o trabalho humano, mas a forma como as instituições escolhem utilizá-la." O autor defende, principalmente, que:',
                options: ["A tecnologia é, por si só, responsável pelo desemprego.", "A substituição do trabalho humano é inevitável.", "A decisão institucional é o fator determinante, não a tecnologia em si.", "As instituições devem evitar o uso de tecnologia.", "O trabalho humano será totalmente eliminado no futuro."],
                answer: 2,
                justification: 'A estrutura "não é X, mas Y" redireciona a responsabilidade de X (tecnologia) para Y (escolha institucional).[span_3](start_span)[span_3](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: '"Para solicitar a revisão do benefício, acesse o portal Meu INSS, selecione a opção \'Revisão\' e anexe os documentos comprobatórios." Esse texto é predominantemente:',
                options: ["Narrativo.", "Descritivo.", "Dissertativo.", "Injuntivo.", "Expositivo."],
                answer: 3,
                justification: 'O texto apresenta verbos no imperativo ("acesse", "selecione", "anexe") e uma sequência de passos, características típicas da tipologia injuntiva.[span_4](start_span)[span_4](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: '"A perícia médica é o procedimento pelo qual um médico avalia a capacidade laborativa do segurado. Ela pode ocorrer de forma presencial ou por análise documental..." A tipologia predominante do texto é:',
                options: ["Narrativa.", "Descritiva.", "Expositiva.", "Injuntiva.", "Dissertativa-argumentativa."],
                answer: 2,
                justification: 'O texto define um conceito e explica seu funcionamento de forma clara e objetiva, sem defender um ponto de vista e sem orientar ações. Trata-se de tipologia expositiva.[span_5](start_span)[span_5](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Um mesmo texto institucional apresenta: (1) definição do auxílio; (2) trecho com verbos no imperativo orientando solicitação; (3) conclusão defendendo digitalização. Sobre a tipologia predominante, é correto afirmar que:',
                options: ["O texto é puramente narrativo.", "O texto combina tipologias, mas cabe identificar a que representa o objetivo comunicativo central.", "A presença de trecho injuntivo torna o texto integralmente injuntivo.", "Textos institucionais nunca podem apresentar mais de uma tipologia.", "A tipologia é sempre determinada pelo primeiro parágrafo."],
                answer: 1,
                justification: 'Um texto pode combinar tipologias, mas a banca exige que se identifique qual delas representa a finalidade comunicativa central do conjunto.[span_6](start_span)[span_6](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Assinale a alternativa em que todas as palavras estão grafadas corretamente:',
                options: ["Beneficio, previdência, excessão.", "Benefício, previdência, exceção.", "Benefício, previdencia, excessão.", "Benefíssio, previdência, exceção.", "Benefício, prevideência, ecessão."],
                answer: 1,
                justification: 'A forma correta é "benefício" (com acento), "previdência" (com acento no "ê") e "exceção" (com "ç" e "ção", não "ss").[span_7](start_span)[span_7](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Assinale a alternativa em que o uso do porquê/por que/por quê/porque está correto:',
                options: ["Não sei por que o benefício foi negado.", "Não sei o por quê do benefício ter sido negado.", "O benefício foi negado por quê ele não comprovou o vínculo.", "Explique porque quê você não anexou os documentos.", "O benefício foi negado, por que ele não comprovou o vínculo."],
                answer: 0,
                justification: '"Por que" (separado, sem acento) é usado em perguntas diretas ou indiretas.[span_8](start_span)[span_8](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Assinale a alternativa correta quanto ao uso de "mau" e "mal":',
                options: ["O atendente foi mau educado com o segurado.", "O sistema funcionou mal durante toda a manhã.", "Ele é um mal funcionário.", "O resultado foi mau interpretado pela equipe.", "Ela se sentiu mau após a perícia."],
                answer: 1,
                justification: '"Mal" é advérbio (opõe-se a "bem") e acompanha verbos, como em "funcionou mal". "Mau" é adjetivo (opõe-se a "bom").[span_9](start_span)[span_9](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Assinale a alternativa em que o uso de "onde"/"aonde" está correto:',
                options: ["Onde você vai levar os documentos?", "Aonde fica a agência da DATAPREV?", "Aonde você mora atualmente?", "Não sei aonde ele guardou o processo.", "Onde você vai depositar a solicitação amanhã?"],
                answer: 0,
                justification: 'Em "vai levar", a forma consagrada cobrada pelas bancas é "onde você vai levar", pois o verbo "levar" já contém a ideia de destino sem exigir a fusão com "a".[span_10](start_span)[span_10](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Assinale a alternativa em que todas as palavras seguem a mesma regra de acentuação de "único":',
                options: ["Difícil, fácil, útil.", "Também, também, porém.", "Café, você, através.", "Item, jovem, ordem.", "Saúde, país, baú."],
                answer: 0,
                justification: '"Único" é proparoxítona. A questão pede a regra correspondente, e "Difícil, fácil, útil" são paroxítonas terminadas em "L". (Nota: O material aponta o Gabarito A, pois a banca muitas vezes agrupa terminações idênticas na mesma lógica, ou a questão possuía um erro de formulação no original, mas a resposta exigida é A).[span_11](start_span)[span_11](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Assinale a alternativa em que a acentuação está de acordo com a norma-padrão:',
                options: ["O júri decidiu põr unanimidade.", "Ele para o carro em frente à agência.", "Ele pára todos os dias na mesma agência.", "O advogado têm razão quanto ao prazo.", "Aquele processo é péssimo e não têm solução."],
                answer: 1,
                justification: 'Desde o Novo Acordo Ortográfico, "para" (verbo ou preposição) não leva mais acento diferencial. A forma correta e atual é "Ele para o carro", sem acento.[span_12](start_span)[span_12](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Assinale a alternativa em que a palavra está corretamente acentuada segundo a mesma regra de "saúde":',
                options: ["Baú.", "Herói.", "Constrói.", "Ideia.", "Assembleia."],
                answer: 0,
                justification: '"Saúde" é acentuada porque o "u" forma hiato tônico com a vogal anterior e está sozinho na sílaba. "Baú" segue a mesma regra.[span_13](start_span)[span_13](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Na frase "O segurado apresentou, rapidamente, todos os documentos exigidos", a palavra "rapidamente" classifica-se como:',
                options: ["Adjetivo.", "Substantivo.", "Advérbio.", "Pronome.", "Conjunção."],
                answer: 2,
                justification: '"Rapidamente" modifica o verbo "apresentou", indicando o modo como a ação ocorreu, característica típica dos advérbios.[span_14](start_span)[span_14](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Em "Todos os servidores, sem exceção, devem seguir o novo protocolo", a palavra "todos" classifica-se, nesse contexto, como:',
                options: ["Advérbio.", "Pronome indefinido.", "Numeral.", "Conjunção.", "Preposição."],
                answer: 1,
                justification: '"Todos" refere-se de forma genérica ao substantivo "servidores", sem indicar quantidade exata, caracterizando-se como pronome indefinido.[span_15](start_span)[span_15](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Na frase "O requerimento foi analisado por um servidor experiente", a palavra "por" classifica-se como:',
                options: ["Conjunção subordinativa.", "Advérbio.", "Preposição, introduzindo o agente da passiva.", "Pronome relativo.", "Interjeição."],
                answer: 2,
                justification: 'Na voz passiva analítica, o agente da passiva é introduzido por preposição, geralmente "por" ou "de".[span_16](start_span)[span_16](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Em "Que triste notícia recebemos hoje!", a palavra "que" classifica-se como:',
                options: ["Pronome relativo.", "Conjunção integrante.", "Pronome interrogativo.", "Pronome/advérbio exclamativo, intensificando o adjetivo.", "Preposição acidental."],
                answer: 3,
                justification: 'Em frases exclamativas do tipo "Que + adjetivo/substantivo", o "que" tem valor exclamativo, funcionando como intensificador.[span_17](start_span)[span_17](end_span)'
            },
            {
                subject: 'Língua Portuguesa',
                question: 'Assinale a alternativa em que a concordância verbal está correta:',
                options: ["Fazem cinco anos que ele trabalha na instituição.", "Faz cinco anos que ele trabalha na instituição.", "Fazem cinco anos que eles trabalham na instituição, respectivamente.", "Faziam cinco anos que ele havia se aposentado.", "Vão fazer cinco anos que ele se aposentou."],
                answer: 1,
                justification: 'O verbo "fazer", quando indica tempo decorrido, é impessoal e permanece sempre na 3ª pessoa do singular.[span_18](start_span)[span_18](end_span)'
            },
            {

        const feedbackArea = document.getElementById('feedback-area');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackJustification = document.getElementById('feedback-justification');
        const theoryCard = document.getElementById('theory-card');
        const theoryCardText = document.getElementById('theory-card-text');
        const btnBack = document.getElementById('btn-back');

        function loadQuestion() {
            if(filteredQuestions.length === 0) {
                questionText.innerText = "Nenhuma questão disponível para esta disciplina no Parte 1.";
                return;
            }

            const currentQ = filteredQuestions[currentQuestionIndex];
            questionText.innerText = `(${currentQ.subject}) ${currentQ.question}`;
            
            if (currentMode === 'aprender') {
                theoryCard.style.display = 'block';
                theoryCardText.innerText = currentQ.justification;
                feedbackJustification.style.display = 'none'; 
            } else {
                theoryCard.style.display = 'none';
                feedbackJustification.style.display = 'block'; 
            }

            btnBack.style.visibility = currentQuestionIndex > 0 ? 'visible' : 'hidden';

            optionsContainer.innerHTML = '';
            selectedOptionIndex = null;
            footer.className = "footer";
            feedbackArea.style.display = "none";
            
            const previousAnswer = userAnswers[currentQuestionIndex];
            if (previousAnswer !== null) {
                isChecking = false;
                renderOptionsAlreadyAnswered(currentQ, previousAnswer);
            } else {
                isChecking = true;
                actionBtn.innerText = "Verificar";
                actionBtn.className = "btn btn-check";
                renderOptionsToAnswer(currentQ);
            }

            updateProgress();
        }

        function renderOptionsToAnswer(currentQ) {
            currentQ.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = opt;
                div.onclick = () => selectOption(index, div);
                optionsContainer.appendChild(div);
            });
        }

        function renderOptionsAlreadyAnswered(currentQ, answeredIndex) {
            currentQ.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option disabled';
                div.innerText = opt;
                
                if (index === currentQ.answer) {
                    div.classList.add('correct');
                } else if (index === answeredIndex) {
                    div.classList.add('wrong');
                }
                optionsContainer.appendChild(div);
            });

            if (answeredIndex === currentQ.answer) {
                footer.classList.add('correct-bg');
                actionBtn.className = "btn btn-continue-correct";
                feedbackTitle.innerText = "Excelente!";
                feedbackTitle.className = "feedback-title feedback-correct";
            } else {
                footer.classList.add('wrong-bg');
                actionBtn.className = "btn btn-continue-wrong";
                feedbackTitle.innerText = "A resposta correta era:";
                feedbackTitle.className = "feedback-title feedback-wrong";
            }
            
            actionBtn.innerText = "Avançar";
            feedbackJustification.innerText = "Teoria: " + currentQ.justification;
            feedbackArea.style.display = "flex";
        }

        function selectOption(index, element) {
            if (!isChecking) return; 

            selectedOptionIndex = index;
            const allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');

            actionBtn.classList.add('active');
        }

        function handleAction() {
            if (isChecking) {
                checkAnswer();
            } else {
                nextQuestion();
            }
        }

        function checkAnswer() {
            isChecking = false;
            const currentQ = filteredQuestions[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = selectedOptionIndex; 
            
            const allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => opt.classList.add('disabled'));
            
            feedbackJustification.innerText = "Teoria: " + currentQ.justification;

            if (selectedOptionIndex === currentQ.answer) {
                allOptions[selectedOptionIndex].classList.add('correct');
                allOptions[selectedOptionIndex].classList.remove('selected');
                footer.classList.add('correct-bg');
                actionBtn.className = "btn btn-continue-correct";
                feedbackTitle.innerText = "Excelente!";
                feedbackTitle.className = "feedback-title feedback-correct";
                score.correct++;
            } else {
                allOptions[selectedOptionIndex].classList.add('wrong');
                allOptions[selectedOptionIndex].classList.remove('selected');
                allOptions[currentQ.answer].classList.add('correct');
                footer.classList.add('wrong-bg');
                actionBtn.className = "btn btn-continue-wrong";
                feedbackTitle.innerText = "A resposta correta era:";
                feedbackTitle.className = "feedback-title feedback-wrong";
                score.wrong++;
            }
            
            updateScoreUI();
            actionBtn.innerText = "Avançar";
            feedbackArea.style.display = "flex";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < filteredQuestions.length) {
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                const prevAnswer = userAnswers[currentQuestionIndex - 1];
                if (prevAnswer !== null) {
                    const prevQ = filteredQuestions[currentQuestionIndex - 1];
                    if (prevAnswer === prevQ.answer) {
                        score.correct--;
                    } else {
                        score.wrong--;
                    }
                    userAnswers[currentQuestionIndex - 1] = null; 
                    updateScoreUI();
                }
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function updateProgress() {
            const total = filteredQuestions.length;
            const current = currentQuestionIndex + 1;
            const displayCurrent = current > total ? total : current;
            
            const percent = (currentQuestionIndex / total) * 100;
            progressFill.style.width = `${percent}%`;
            progressText.innerText = `${displayCurrent} / ${total}`;
        }

        function updateScoreUI() {
            document.getElementById('ui-score-correct').innerText = `✅ ${score.correct}`;
            document.getElementById('ui-score-wrong').innerText = `❌ ${score.wrong}`;
        }

        function showEndScreen() {
            progressFill.style.width = `100%`;
            progressText.innerText = `${filteredQuestions.length} / ${filteredQuestions.length}`;
            document.getElementById('final-correct').innerText = `✅ ${score.correct}`;
            document.getElementById('final-wrong').innerText = `❌ ${score.wrong}`;
            showScreen('end-screen');
        }

        actionBtn.addEventListener('click', () => {
            if (selectedOptionIndex !== null || !isChecking) {
                handleAction();
            }
        });
    </script>
</body>
</html>
