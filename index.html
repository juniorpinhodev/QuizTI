<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinamento DATAPREV</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');

        /* Variáveis para os temas Claro e Escuro */
        :root {
            --bg-color: #ffffff;
            --text-color: #4b4b4b;
            --subtitle-color: #777777;
            --border-color: #e5e5e5;
            --opt-bg: #ffffff;
            --opt-hover: #f7f7f7;
            --theory-bg: #ddf4ff;
            --theory-border: #84d8ff;
            --theory-title: #1cb0f6;
            --feedback-bg: rgba(255, 255, 255, 0.6);
            --header-icon: #afafaf;
            --selected-bg: #ddf4ff;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --subtitle-color: #a0a0a0;
            --border-color: #333333;
            --opt-bg: #1e1e1e;
            --opt-hover: #2c2c2c;
            --theory-bg: #1e293b;
            --theory-border: #38bdf8;
            --theory-title: #38bdf8;
            --feedback-bg: rgba(0, 0, 0, 0.4);
            --header-icon: #888888;
            --selected-bg: #0c3149;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Controle de Tema */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--header-icon);
            padding: 5px;
            z-index: 10;
        }

        /* Telas */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .screen.active {
            display: flex;
        }

        /* Tela Inicial e Assuntos */
        .menu-container {
            max-width: 400px;
            width: 100%;
            padding: 60px 20px 40px 20px;
            text-align: center;
            margin: auto;
        }

        .menu-title {
            font-size: 28px;
            font-weight: 800;
            color: #58cc02;
            margin-bottom: 10px;
        }

        .menu-subtitle {
            font-size: 18px;
            margin-bottom: 30px;
            color: var(--subtitle-color);
        }

        .menu-btn {
            padding: 15px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 15px;
            border: 2px solid var(--border-color);
            background-color: var(--opt-bg);
            color: var(--text-color);
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            transition: all 0.2s;
            box-shadow: 0 4px 0 var(--border-color);
        }

        .menu-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .menu-btn.primary {
            background-color: #58cc02;
            color: #fff;
            border-color: #58cc02;
            box-shadow: 0 4px 0 #58a700;
        }

        .menu-btn.secondary {
            background-color: #1cb0f6;
            color: #fff;
            border-color: #1cb0f6;
            box-shadow: 0 4px 0 #1899d6;
        }

        /* Cabeçalho do Quiz */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .nav-btn {
            font-size: 24px;
            color: var(--header-icon);
            cursor: pointer;
            font-weight: bold;
            padding: 5px 10px;
        }

        .progress-bar {
            flex-grow: 1;
            height: 16px;
            background-color: var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin: 0 10px;
        }

        .progress-fill {
            height: 100%;
            background-color: #58cc02;
            width: 0%;
            border-radius: 8px;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-color);
            margin-right: 15px;
            white-space: nowrap;
        }

        /* Placar */
        .score-board {
            display: flex;
            gap: 10px;
            font-weight: 800;
            font-size: 16px;
        }
        .score-correct { color: #58cc02; }
        .score-wrong { color: #ea2b2b; }

        /* Área da Pergunta */
        .quiz-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        /* Cartão de Teoria */
        .theory-card {
            background-color: var(--theory-bg);
            border: 2px solid var(--theory-border);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
            display: none;
        }
        
        .theory-card h3 {
            margin: 0 0 10px 0;
            color: var(--theory-title);
            font-size: 16px;
            text-transform: uppercase;
        }

        .theory-card p {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.4;
        }

        .question-title {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 25px;
            text-align: left;
            width: 100%;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .option {
            padding: 15px;
            border: 2px solid var(--border-color);
            background-color: var(--opt-bg);
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
            transition: all 0.2s ease;
            line-height: 1.3;
        }

        .option:hover {
            background-color: var(--opt-hover);
        }

        .option.selected {
            border-color: #84d8ff;
            background-color: var(--selected-bg);
            color: #1cb0f6;
        }

        .option.correct {
            border-color: #58cc02;
            background-color: #d7ffb8;
            color: #4b4b4b;
            pointer-events: none;
        }

        .option.wrong {
            border-color: #ea2b2b;
            background-color: #ffdfe0;
            color: #4b4b4b;
            pointer-events: none;
        }

        body.dark-mode .option.correct { background-color: rgba(88, 204, 2, 0.2); color: #e0e0e0; }
        body.dark-mode .option.wrong { background-color: rgba(234, 43, 43, 0.2); color: #e0e0e0; }

        .option.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        /* Rodapé e Botões */
        .footer {
            border-top: 2px solid var(--border-color);
            background-color: var(--bg-color);
            padding: 15px 20px 20px 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s;
        }

        .footer-content {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .feedback-area {
            display: none;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .feedback-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .feedback-justification {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.4;
            background-color: var(--feedback-bg);
            padding: 10px;
            border-radius: 10px;
            margin: 0;
        }

        .feedback-correct { color: #58cc02; }
        .feedback-wrong { color: #ea2b2b; }

        .btn {
            padding: 15px;
            font-size: 17px;
            font-weight: 800;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn-check { background-color: var(--border-color); color: var(--header-icon); pointer-events: none; }
        .btn-check.active { background-color: #58cc02; color: #ffffff; box-shadow: 0 4px 0 #58a700; pointer-events: auto; }
        .btn-check.active:active { transform: translateY(4px); box-shadow: none; }
        
        .footer.correct-bg { background-color: #d7ffb8; border-color: #d7ffb8; }
        .footer.wrong-bg { background-color: #ffdfe0; border-color: #ffdfe0; }
        
        body.dark-mode .footer.correct-bg { background-color: rgba(88, 204, 2, 0.15); border-color: rgba(88, 204, 2, 0.3); }
        body.dark-mode .footer.wrong-bg { background-color: rgba(234, 43, 43, 0.15); border-color: rgba(234, 43, 43, 0.3); }

        .btn-continue-correct { background-color: #58cc02; color: #ffffff; box-shadow: 0 4px 0 #58a700; }
        .btn-continue-wrong { background-color: #ea2b2b; color: #ffffff; box-shadow: 0 4px 0 #c72323; }
        .btn-continue-correct:active, .btn-continue-wrong:active { transform: translateY(4px); box-shadow: none; }

        /* Placar Final */
        .final-score {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .final-stat {
            background-color: var(--opt-bg);
            border: 2px solid var(--border-color);
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" title="Alternar Tema">🌓</button>

    <!-- TELA INICIAL -->
    <div class="screen active" id="home-screen">
        <div class="menu-container">
            <div class="menu-title">Treinamento DATAPREV</div>
            <div class="menu-subtitle">Como você quer estudar hoje?</div>
            <button class="menu-btn primary" onclick="selectMode('aprender')">Modo Aprender (Teoria Antes)</button>
            <button class="menu-btn secondary" onclick="selectMode('quiz')">Modo Quiz (Teoria Depois)</button>
        </div>
    </div>

    <!-- TELA DE DISCIPLINAS -->
    <div class="screen" id="subject-screen">
        <div class="menu-container">
            <div class="menu-title">Escolha o Assunto</div>
            <div class="menu-subtitle">Filtre as questões por disciplina</div>
            <button class="menu-btn" onclick="startQuiz('Desenvolvimento de Software')">Desenvolvimento de Software</button>
            <button class="menu-btn" onclick="startQuiz('LGPD')">LGPD</button>
            <button class="menu-btn" onclick="startQuiz('Segurança da Informação')">Segurança da Informação</button>
            <button class="menu-btn" onclick="startQuiz('Raciocínio Lógico')">Raciocínio Lógico</button>
            <button class="menu-btn" onclick="startQuiz('Língua Portuguesa')">Língua Portuguesa</button>
            <button class="menu-btn primary" onclick="startQuiz('Todos')">Misturar Todos</button>
            <br><br>
            <div class="nav-btn" onclick="showScreen('home-screen')">← Voltar</div>
        </div>
    </div>

    <!-- TELA DO QUIZ -->
    <div class="screen" id="quiz-screen">
        <div class="header">
            <div class="nav-btn" id="btn-back" onclick="prevQuestion()" title="Questão Anterior">←</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <!-- INDICADOR DE PROGRESSÃO -->
            <div class="progress-text" id="progress-text">1 / 40</div>
            <div class="score-board">
                <span class="score-correct" id="ui-score-correct">✅ 0</span>
                <span class="score-wrong" id="ui-score-wrong">❌ 0</span>
            </div>
            <div class="nav-btn" onclick="showScreen('home-screen')" title="Sair do Quiz" style="margin-left: 15px;">×</div>
        </div>

        <div class="quiz-content" id="quiz-container">
            <div class="theory-card" id="theory-card">
                <h3>Teoria</h3>
                <p id="theory-card-text"></p>
            </div>
            <div class="question-title" id="question-text">Carregando...</div>
            <div class="options" id="options-container"></div>
        </div>

        <div class="footer" id="footer">
            <div class="footer-content">
                <div class="feedback-area" id="feedback-area">
                    <div class="feedback-title" id="feedback-title"></div>
                    <p class="feedback-justification" id="feedback-justification"></p>
                </div>
                <button class="btn btn-check" id="action-btn">Verificar</button>
            </div>
        </div>
    </div>

    <!-- TELA FINAL -->
    <div class="screen" id="end-screen">
        <div class="menu-container">
            <div class="menu-title" style="font-size: 32px;">Lição Concluída!</div>
            <div class="menu-subtitle">Veja o seu desempenho:</div>
            
            <div class="final-score">
                <div class="final-stat" style="color: #58cc02;" id="final-correct">✅ 0</div>
                <div class="final-stat" style="color: #ea2b2b;" id="final-wrong">❌ 0</div>
            </div>

            <button class="menu-btn primary" onclick="showScreen('home-screen')">Voltar ao Início</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        const allQuestions = [
            // ================== DESENVOLVIMENTO DE SOFTWARE (40 Questões) ==================
            {
                subject: 'Desenvolvimento de Software',
                question: 'Em um banco de dados relacional, a "chave primária" (primary key) de uma tabela tem como principal função:',
                options: ["Permitir valores duplicados e nulos livremente.", "Identificar de forma única cada registro (linha) da tabela.", "Definir exclusivamente o tipo de dado de uma coluna.", "Armazenar comentários sobre a tabela.", "Substituir a necessidade de qualquer outro tipo de índice."],
                answer: 1,
                justification: 'A chave primária identifica de forma ÚNICA cada registro (linha) de uma tabela, não podendo conter valores duplicados nem nulos, sendo fundamental para garantir a integridade.'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'Em um banco de dados relacional, a "chave estrangeira" (foreign key) tem como principal função:',
                options: ["Substituir a chave primária da própria tabela.", "Estabelecer um relacionamento entre duas tabelas, referenciando a chave primária de outra tabela.", "Impedir qualquer tipo de consulta entre tabelas diferentes.", "Armazenar dados criptografados exclusivamente.", "Definir o nome da tabela no banco de dados."],
                answer: 1,
                justification: 'A chave estrangeira é uma coluna em uma tabela que referencia a chave primária de OUTRA tabela, estabelecendo e garantindo a integridade referencial de relacionamentos (ex: Pedido -> Cliente).'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'O processo de normalização de bancos de dados relacionais tem como principal objetivo:',
                options: ["Aumentar a redundância de dados para melhorar o desempenho.", "Reduzir a redundância de dados e evitar anomalias de inserção, atualização e exclusão, organizando os dados de forma mais eficiente.", "Eliminar completamente a necessidade de chaves primárias.", "Impedir qualquer relacionamento entre tabelas.", "Duplicar todas as tabelas para fins de backup."],
                answer: 1,
                justification: 'A normalização visa reduzir a redundância de informações e evitar anomalias, geralmente aplicando regras conhecidas como "formas normais".'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'Bancos de dados NoSQL, como MongoDB, diferem dos bancos relacionais tradicionais principalmente por:',
                options: ["Utilizarem exclusivamente tabelas com esquema rígido e fixo.", "Não permitirem qualquer tipo de consulta aos dados armazenados.", "Oferecerem maior flexibilidade de esquema (schema), armazenando dados em formatos como documentos, chave-valor, grafos ou colunas, sem exigir estrutura tabular rígida.", "Serem utilizados exclusivamente para armazenamento de imagens.", "Exigirem obrigatoriamente o uso de linguagem SQL para todas as operações."],
                answer: 2,
                justification: 'Bancos de dados NoSQL oferecem flexibilidade de esquema e armazenam dados em diversos modelos (documentos, chave-valor, grafos), sem exigir estrutura tabular rígida predefinida.'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'Um sistema de alta demanda precisa garantir consistência forte em transações financeiras críticas, mesmo com possível perda de disponibilidade momentânea em caso de falha de rede. Segundo o Teorema CAP, esse sistema deve priorizar:',
                options: ["Disponibilidade e Tolerância a Partição, sacrificando Consistência.", "Consistência e Tolerância a Partição, aceitando possível perda de disponibilidade durante falhas de rede.", "Apenas Consistência, sem considerar Tolerância a Partição.", "Apenas Disponibilidade, ignorando completamente Consistência e Partição.", "Nenhuma das três propriedades é relevante para sistemas financeiros."],
                answer: 1,
                justification: 'O Teorema CAP diz que você escolhe 2 de 3 propriedades. Para garantir Consistência forte em falhas de rede, prioriza-se Consistência (C) e Tolerância a Partição (P), abdicando de Disponibilidade temporária.'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'Assinale a alternativa que apresenta o comando SQL correto para selecionar todos os registros da tabela "funcionarios":',
                options: ["GET * FROM funcionarios;", "SELECT * FROM funcionarios;", "FETCH ALL funcionarios;", "RETRIEVE * FROM funcionarios;", "SHOW * FROM funcionarios;"],
                answer: 1,
                justification: 'O comando "SELECT * FROM funcionarios;" é a sintaxe correta e padrão em SQL para consultar todos os registros e colunas.'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'Assinale a alternativa que apresenta o comando SQL correto para selecionar apenas os funcionários com salário superior a R$ 5.000,00:',
                options: ["SELECT * FROM funcionarios WHERE salario > 5000;", "SELECT * FROM funcionarios FILTER salario > 5000;", "SELECT * FROM funcionarios IF salario > 5000;", "SELECT * FROM funcionarios HAVING salario > 5000;", "SELECT * FROM funcionarios WHEN salario > 5000;"],
                answer: 0,
                justification: 'A cláusula WHERE é utilizada em SQL para filtrar registros com base em uma condição, antes de qualquer agrupamento.'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'Assinale a alternativa que apresenta corretamente o comando SQL para contar quantos funcionários existem em cada departamento, agrupando o resultado por departamento:',
                options: ["SELECT departamento, COUNT(*) FROM funcionarios GROUP BY departamento;", "SELECT departamento, COUNT(*) FROM funcionarios WHERE departamento;", "SELECT departamento, COUNT(*) FROM funcionarios ORDER BY departamento;", "SELECT departamento, COUNT(*) FROM funcionarios FILTER BY departamento;", "SELECT departamento, COUNT(*) FROM funcionarios LIMIT departamento;"],
                answer: 0,
                justification: 'A cláusula GROUP BY agrupa registros para que funções de agregação, como COUNT(*), calculem valores separadamente por categoria.'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'Assinale a alternativa que apresenta corretamente o tipo de JOIN que retorna APENAS os registros que possuem correspondência em AMBAS as tabelas envolvidas:',
                options: ["LEFT JOIN.", "RIGHT JOIN.", "INNER JOIN.", "FULL OUTER JOIN.", "CROSS JOIN sem condição."],
                answer: 2,
                justification: 'O INNER JOIN funciona como uma interseção, retornando exclusivamente registros que dão "match" nas duas tabelas.'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'Para listar TODOS os clientes, incluindo aqueles que NUNCA realizaram nenhum pedido, junto com a quantidade de pedidos de cada um (0 para quem não tem nenhum). A abordagem adequada é:',
                options: ["Usar INNER JOIN entre clientes e pedidos, agrupando por cliente.", "Usar LEFT JOIN de clientes para pedidos (mantendo todos os clientes), agrupando por cliente e usando COUNT() sobre a coluna de pedidos.", "Usar apenas uma consulta em pedidos, sem envolver a tabela de clientes.", "Usar RIGHT JOIN de pedidos para clientes, sem agrupamento.", "Usar CROSS JOIN entre as duas tabelas."],
                answer: 1,
                justification: 'O LEFT JOIN preserva integralmente a tabela da esquerda (clientes), mesmo quando não há correspondência na tabela da direita (pedidos).'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'Em programação orientada a objetos, o princípio que consiste em ocultar os detalhes internos de implementação de um objeto, expondo apenas uma interface pública controlada, é conhecido como:',
                options: ["Herança.", "Polimorfismo.", "Encapsulamento.", "Abstração de dados apenas.", "Sobrecarga de métodos."],
                answer: 2,
                justification: 'O encapsulamento atua como uma "caixa preta", escondendo a lógica/dados internos e forçando o uso de métodos públicos controlados (getters/setters).'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'O princípio que permite que um mesmo método ("emitirSom()") tenha comportamentos diferentes em "Cachorro" e "Gato", ambos subclasses de "Animal", é conhecido como:',
                options: ["Encapsulamento.", "Herança simples.", "Polimorfismo.", "Composição.", "Interface segregada."],
                answer: 2,
                justification: 'Polimorfismo (muitas formas) permite que objetos de subclasses diferentes respondam ao mesmo método/mensagem de maneiras específicas.'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'Em orientação a objetos, uma "interface" é caracterizada por:',
                options: ["Conter apenas a implementação completa de todos os métodos.", "Definir um contrato de métodos que devem ser implementados pelas classes que a adotam, geralmente sem fornecer implementação própria.", "Ser sempre idêntica a uma classe abstrata.", "Permitir apenas um único método.", "Ser utilizada exclusivamente em bancos de dados relacionais."],
                answer: 1,
                justification: 'Uma interface é um "contrato" de assinaturas de métodos que as classes devem cumprir, ditando "o que" fazer, sem ditar o "como".'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'Em orientação a objetos, o conceito de "herança" permite que:',
                options: ["Uma classe filha herde atributos e métodos de uma classe pai, podendo reutilizá-los e/ou especializá-los.", "Duas classes completamente diferentes compartilhem o mesmo nome de método.", "Um objeto nunca possa ser instanciado a partir de uma classe.", "Todos os métodos de uma classe sejam automaticamente privados.", "Uma classe seja convertida automaticamente em uma interface."],
                answer: 0,
                justification: 'A herança promove o reuso de código e especialização através do relacionamento "é um" (ex: Gato é um Animal).'
            },
            {
                subject: 'Desenvolvimento de Software',
                question: 'Para evitar hierarquias complexas em herança múltipla (problema do diamante), uma alternativa de design mais recomendada seria:',
                options: ["Aumentar ainda mais os níveis de herança múltipla.", "Favorecer composição sobre herança, utilizando interfaces e delegação para combinar comportamentos.", "Eliminar completamente reutilização de código.", "Utilizar apenas variáveis globais.", "Ignorar o problema."],
                answer: 1,
                justification: '"Favoreça composição sobre herança" é um princípio clássico de design (GoF) para criar sistemas mais flexíveis e com menor acoplamento.'
            },
            {
                subject: 'Desenvolvimento de Software',

            // Segurança da Informação
            {
                subject: 'Segurança da Informação',
                question: 'O princípio que garante que uma informação só seja acessada por pessoas autorizadas é conhecido como:',
                options: ["Integridade.", "Disponibilidade.", "Confidencialidade.", "Autenticidade.", "Não repúdio."],

            // Raciocínio Lógico
            {
                subject: 'Raciocínio Lógico',
                question: 'Assinale a alternativa que apresenta uma proposição lógica:',
                options: ["Que dia é hoje?", "Feche a porta, por favor.", "A DATAPREV foi fundada em 1974.", "Talvez chova amanhã."],
                answer: 2, 
                justification: 'Uma proposição lógica precisa ser uma sentença declarativa e que possa ser classificada objetivamente como verdadeira ou falsa.'
            },

            // Língua Portuguesa
            {
                subject: 'Língua Portuguesa',
                question: '"O atendimento remoto cresceu 40%. Apesar do avanço tecnológico, muitos preferem o presencial." A palavra "apesar" indica:',
                options: ["Adição.", "Conclusão.", "Contraste entre a informação anterior e a posterior.", "Explicação da causa."],
                answer: 2, 
                justification: '"Apesar de" é locução concessiva que introduz contraste. O texto admite um fato (avanço) e apresenta algo que o contraria.'

        let currentMode = 'quiz';
        let currentSubject = 'Todos';
        let filteredQuestions = [];
        let currentQuestionIndex = 0;
        let selectedOptionIndex = null;
        let isChecking = true;
        let userAnswers = [];
        let score = { correct: 0, wrong: 0 };

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function selectMode(mode) {
            currentMode = mode;
            showScreen('subject-screen');
        }

        function startQuiz(subject) {
            currentSubject = subject;
            if (subject === 'Todos') {
                filteredQuestions = [...allQuestions];
            } else {
                filteredQuestions = allQuestions.filter(q => q.subject === subject);
            }
            
            currentQuestionIndex = 0;
            score = { correct: 0, wrong: 0 };
            userAnswers = new Array(filteredQuestions.length).fill(null);
            
            updateScoreUI();
            showScreen('quiz-screen');
            loadQuestion();
        }

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const actionBtn = document.getElementById('action-btn');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const footer = document.getElementById('footer');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackJustification = document.getElementById('feedback-justification');
        const theoryCard = document.getElementById('theory-card');
        const theoryCardText = document.getElementById('theory-card-text');
        const btnBack = document.getElementById('btn-back');

        function loadQuestion() {
            const currentQ = filteredQuestions[currentQuestionIndex];
            
            questionText.innerText = `(${currentQ.subject}) ${currentQ.question}`;
            
            if (currentMode === 'aprender') {
                theoryCard.style.display = 'block';
                theoryCardText.innerText = currentQ.justification;
                feedbackJustification.style.display = 'none'; 
            } else {
                theoryCard.style.display = 'none';
                feedbackJustification.style.display = 'block'; 
            }

            btnBack.style.visibility = currentQuestionIndex > 0 ? 'visible' : 'hidden';

            optionsContainer.innerHTML = '';
            selectedOptionIndex = null;
            footer.className = "footer";
            feedbackArea.style.display = "none";
            
            const previousAnswer = userAnswers[currentQuestionIndex];
            if (previousAnswer !== null) {
                isChecking = false;
                renderOptionsAlreadyAnswered(currentQ, previousAnswer);
            } else {
                isChecking = true;
                actionBtn.innerText = "Verificar";
                actionBtn.className = "btn btn-check";
                renderOptionsToAnswer(currentQ);
            }

            updateProgress();
        }

        function renderOptionsToAnswer(currentQ) {
            currentQ.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = opt;
                div.onclick = () => selectOption(index, div);
                optionsContainer.appendChild(div);
            });
        }

        function renderOptionsAlreadyAnswered(currentQ, answeredIndex) {
            currentQ.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option disabled';
                div.innerText = opt;
                
                if (index === currentQ.answer) {
                    div.classList.add('correct');
                } else if (index === answeredIndex) {
                    div.classList.add('wrong');
                }
                optionsContainer.appendChild(div);
            });

            if (answeredIndex === currentQ.answer) {
                footer.classList.add('correct-bg');
                actionBtn.className = "btn btn-continue-correct";
                feedbackTitle.innerText = "Excelente!";
                feedbackTitle.className = "feedback-title feedback-correct";
            } else {
                footer.classList.add('wrong-bg');
                actionBtn.className = "btn btn-continue-wrong";
                feedbackTitle.innerText = "A resposta correta era:";
                feedbackTitle.className = "feedback-title feedback-wrong";
            }
            
            actionBtn.innerText = "Avançar";
            feedbackJustification.innerText = "Teoria: " + currentQ.justification;
            feedbackArea.style.display = "flex";
        }

        function selectOption(index, element) {
            if (!isChecking) return; 

            selectedOptionIndex = index;
            const allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');

            actionBtn.classList.add('active');
        }

        function handleAction() {
            if (isChecking) {
                checkAnswer();
            } else {
                nextQuestion();
            }
        }

        function checkAnswer() {
            isChecking = false;
            const currentQ = filteredQuestions[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = selectedOptionIndex; 
            
            const allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => opt.classList.add('disabled'));
            
            feedbackJustification.innerText = "Teoria: " + currentQ.justification;

            if (selectedOptionIndex === currentQ.answer) {
                allOptions[selectedOptionIndex].classList.add('correct');
                allOptions[selectedOptionIndex].classList.remove('selected');
                footer.classList.add('correct-bg');
                actionBtn.className = "btn btn-continue-correct";
                feedbackTitle.innerText = "Excelente!";
                feedbackTitle.className = "feedback-title feedback-correct";
                score.correct++;
            } else {
                allOptions[selectedOptionIndex].classList.add('wrong');
                allOptions[selectedOptionIndex].classList.remove('selected');
                allOptions[currentQ.answer].classList.add('correct');
                footer.classList.add('wrong-bg');
                actionBtn.className = "btn btn-continue-wrong";
                feedbackTitle.innerText = "A resposta correta era:";
                feedbackTitle.className = "feedback-title feedback-wrong";
                score.wrong++;
            }
            
            updateScoreUI();
            actionBtn.innerText = "Avançar";
            feedbackArea.style.display = "flex";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < filteredQuestions.length) {
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                const prevAnswer = userAnswers[currentQuestionIndex - 1];
                if (prevAnswer !== null) {
                    const prevQ = filteredQuestions[currentQuestionIndex - 1];
                    if (prevAnswer === prevQ.answer) {
                        score.correct--;
                    } else {
                        score.wrong--;
                    }
                    userAnswers[currentQuestionIndex - 1] = null; 
                    updateScoreUI();
                }
                
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function updateProgress() {
            const total = filteredQuestions.length;
            const current = currentQuestionIndex + 1;
            const displayCurrent = current > total ? total : current;
            
            const percent = (currentQuestionIndex / total) * 100;
            progressFill.style.width = `${percent}%`;
            progressText.innerText = `${displayCurrent} / ${total}`;
        }

        function updateScoreUI() {
            document.getElementById('ui-score-correct').innerText = `✅ ${score.correct}`;
            document.getElementById('ui-score-wrong').innerText = `❌ ${score.wrong}`;
        }

        function showEndScreen() {
            progressFill.style.width = `100%`;
            progressText.innerText = `${filteredQuestions.length} / ${filteredQuestions.length}`;
            document.getElementById('final-correct').innerText = `✅ ${score.correct}`;
            document.getElementById('final-wrong').innerText = `❌ ${score.wrong}`;
            showScreen('end-screen');
        }

        actionBtn.addEventListener('click', () => {
            if (selectedOptionIndex !== null || !isChecking) {
                handleAction();
            }
        });
    </script>
